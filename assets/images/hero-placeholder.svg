<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Placeholder illustration. Replace with a real photo: Appearance > Customize > LD: Hero Banner > Hero image. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edf3"/>
      <stop offset="1" stop-color="#cdd5e0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="0.6" stop-color="#e8eaee"/>
      <stop offset="1" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="1" stop-color="#151b29"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5fb3"/>
      <stop offset="1" stop-color="#173f82"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9dde4"/>
      <stop offset="1" stop-color="#9aa3b1"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3h6M3 0v6" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="satin" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 0v5" stroke="#000" stroke-opacity="0.14" stroke-width="1.2"/>
    </pattern>
    <radialGradient id="glow" cx="0.55" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="cone">
      <path d="M-20 0 L-11 -78 h22 L20 0z"/>
      <path d="M-20 0 L-11 -78 h22 L20 0z" fill="url(#satin)"/>
      <rect x="-24" y="0" width="48" height="10" rx="3" fill="#3b4354"/>
      <rect x="-3" y="-92" width="6" height="16" fill="#8a93a3"/>
    </g>
    <g id="needle">
      <rect x="-9" y="0" width="18" height="70" rx="4" fill="#d5d9e0" stroke="#8d96a6" stroke-width="2"/>
      <rect x="-4" y="70" width="8" height="34" fill="#9aa3b1"/>
      <path d="M-1.5 104h3l-1.5 18z" fill="#5d6677"/>
      <path d="M-14 112h28v8h-28z" fill="#7c8596"/>
    </g>
    <g id="petal">
      <ellipse cx="0" cy="-26" rx="15" ry="27"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>

  <!-- thread stand -->
  <rect x="140" y="128" width="1000" height="10" rx="5" fill="#8a93a3"/>
  <g transform="translate(200 128)" fill="#c8202f"><use href="#cone"/></g>
  <g transform="translate(300 128)" fill="#f2b705"><use href="#cone"/></g>
  <g transform="translate(400 128)" fill="#1e63c9"><use href="#cone"/></g>
  <g transform="translate(500 128)" fill="#2c9a52"><use href="#cone"/></g>
  <g transform="translate(600 128)" fill="#f4f4f4"><use href="#cone"/></g>
  <g transform="translate(700 128)" fill="#e75a8c"><use href="#cone"/></g>
  <g transform="translate(800 128)" fill="#101729"><use href="#cone"/></g>
  <g transform="translate(900 128)" fill="#f07c1d"><use href="#cone"/></g>
  <g transform="translate(1000 128)" fill="#7a3fc4"><use href="#cone"/></g>
  <g transform="translate(1100 128)" fill="#16a3a3"><use href="#cone"/></g>

  <!-- machine head -->
  <path d="M90 190 Q90 160 120 160 H1200 V420 H90z" fill="url(#body)"/>
  <rect x="90" y="300" width="1110" height="44" fill="url(#band)"/>
  <rect x="120" y="186" width="230" height="84" rx="10" fill="#101729"/>
  <rect x="134" y="200" width="150" height="56" rx="6" fill="#1d6fb8"/>
  <path d="M146 238h40M146 224h86M196 238h30" stroke="#bfe0ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="314" cy="214" r="10" fill="#2c9a52"/>
  <circle cx="314" cy="244" r="10" fill="#c8202f"/>
  <text x="1150" y="330" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#e9edf3" letter-spacing="6">MULTI-NEEDLE</text>

  <!-- thread paths -->
  <g stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M560 46 C560 120 470 170 470 420" stroke="#c8202f"/>
    <path d="M600 46 C600 140 530 180 530 420" stroke="#f2b705"/>
    <path d="M700 46 C700 140 650 180 650 420" stroke="#e75a8c"/>
    <path d="M800 46 C800 160 710 190 710 420" stroke="#2c9a52"/>
  </g>

  <!-- needle case -->
  <path d="M380 344 H1020 L1000 430 H400z" fill="#e3e6eb"/>
  <path d="M400 430 H1000" stroke="#a8b0bd" stroke-width="3"/>
  <g transform="translate(0 430)">
    <use href="#needle" x="440"/>
    <use href="#needle" x="500"/>
    <use href="#needle" x="560"/>
    <use href="#needle" x="620" y="22"/>
    <use href="#needle" x="680"/>
    <use href="#needle" x="740"/>
    <use href="#needle" x="800"/>
    <use href="#needle" x="860"/>
    <use href="#needle" x="920"/>
  </g>

  <!-- free arm / bed -->
  <path d="M0 640 H1200 V900 H0z" fill="#59606d"/>
  <path d="M0 640 H1200" stroke="#3d434e" stroke-width="4"/>

  <!-- fabric -->
  <path d="M-20 560 C200 545 420 580 640 568 C860 556 1040 548 1220 560 V900 H-20z" fill="url(#fabric)"/>
  <path d="M-20 560 C200 545 420 580 640 568 C860 556 1040 548 1220 560 V900 H-20z" fill="url(#weave)"/>
  <path d="M-20 620 C240 610 460 640 700 628 C900 618 1060 615 1220 622" stroke="#0f2f66" stroke-opacity="0.35" stroke-width="10" fill="none"/>

  <!-- hoop -->
  <ellipse cx="640" cy="720" rx="360" ry="150" fill="none" stroke="#1a1f2b" stroke-width="22"/>
  <ellipse cx="640" cy="720" rx="342" ry="138" fill="none" stroke="#3a4152" stroke-width="6"/>
  <rect x="270" y="700" width="40" height="40" rx="6" fill="#1a1f2b"/>
  <rect x="970" y="700" width="40" height="40" rx="6" fill="#1a1f2b"/>

  <!-- floral embroidery -->
  <g>
    <path d="M500 800 C540 760 560 720 600 700 M640 810 C640 760 650 720 700 690 M770 800 C760 760 740 730 720 700" stroke="#2c9a52" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#35a85d"><ellipse cx="540" cy="762" rx="26" ry="11" transform="rotate(-35 540 762)"/><ellipse cx="672" cy="752" rx="26" ry="11" transform="rotate(-60 672 752)"/><ellipse cx="752" cy="760" rx="26" ry="11" transform="rotate(40 752 760)"/><ellipse cx="590" cy="790" rx="22" ry="9" transform="rotate(20 590 790)"/></g>
    <g fill="url(#satin)"><ellipse cx="540" cy="762" rx="26" ry="11" transform="rotate(-35 540 762)"/><ellipse cx="672" cy="752" rx="26" ry="11" transform="rotate(-60 672 752)"/><ellipse cx="752" cy="760" rx="26" ry="11" transform="rotate(40 752 760)"/></g>

    <!-- flower 1 -->
    <g transform="translate(600 690) scale(1.15)">
      <g fill="#d42b45"><use href="#petal"/><use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(300)"/></g>
      <g fill="url(#satin)"><use href="#petal"/><use href="#petal" transform="rotate(60)"/><use href="#petal" transform="rotate(120)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(240)"/><use href="#petal" transform="rotate(300)"/></g>
      <circle r="14" fill="#f6c23e"/>
    </g>
    <!-- flower 2 -->
    <g transform="translate(712 680) scale(0.9)">
      <g fill="#f6f2ea"><use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(102)"/><use href="#petal" transform="rotate(174)"/><use href="#petal" transform="rotate(246)"/><use href="#petal" transform="rotate(318)"/></g>
      <g fill="url(#satin)"><use href="#petal" transform="rotate(30)"/><use href="#petal" transform="rotate(102)"/><use href="#petal" transform="rotate(174)"/><use href="#petal" transform="rotate(246)"/><use href="#petal" transform="rotate(318)"/></g>
      <circle r="13" fill="#e8892a"/>
    </g>
    <!-- flower 3 -->
    <g transform="translate(500 740) scale(0.75)">
      <g fill="#f6c23e"><use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/></g>
      <g fill="url(#satin)"><use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/></g>
      <circle r="12" fill="#c8202f"/>
    </g>
    <!-- bud -->
    <g transform="translate(780 735) scale(0.6)">
      <g fill="#e75a8c"><use href="#petal" transform="rotate(-30)"/><use href="#petal" transform="rotate(30)"/><use href="#petal"/></g>
    </g>
    <!-- running stitch outline -->
    <path d="M430 700 C470 640 560 620 640 628 C740 636 820 660 850 720" stroke="#f6f2ea" stroke-width="3" stroke-dasharray="7 6" fill="none" opacity="0.8"/>
  </g>

  <rect width="1200" height="900" fill="url(#glow)"/>
</svg>
